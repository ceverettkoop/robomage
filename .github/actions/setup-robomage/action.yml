name: Set up robomage
description: >
  Set up python3 (stdlib only: card-script provisioning and the gate's smoke
  tier), provision the Forge card scripts and build the headless engine, with
  card-script / ccache caching. Shared by the CI and nightly-fuzz workflows so
  both use an identical environment.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # Card + token scripts are .gitignored and fetched from Card-Forge/forge.
    # Restore-then-save (not the monolithic cache action) so the FIRST run still
    # populates the cache even if a later build/test step fails the job. The fetch
    # tool is add-only, so a stale restore only re-fetches the delta.
    #
    # The cache key and its restore-keys fallback are BOTH scoped by the FORGE_PIN
    # hash. Scripts are pinned to that commit, so within a pin they are immutable and
    # add-only provisioning is correct. When FORGE_PIN is bumped (changed scripts),
    # the pin-scoped restore-keys prefix no longer matches any prior cache, so the
    # restore is empty and provisioning re-fetches the whole set at the NEW pin —
    # otherwise the broad fallback would restore old-pin scripts that add-only never
    # overwrites, silently shipping stale card content into the engine.
    - name: Restore card scripts cache
      id: cards-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          bin/resources/cardsfolder
          bin/resources/tokenscripts
        key: cards-v2-${{ hashFiles('tools/forge_fetch/FORGE_PIN') }}-${{ hashFiles('bin/resources/decks/**/*.dk', 'src/card_vocab.h', 'tools/forge_fetch/*.py') }}
        restore-keys: cards-v2-${{ hashFiles('tools/forge_fetch/FORGE_PIN') }}-

    - name: Provision card + token scripts
      shell: bash
      env:
        # Authenticates the contents-API calls fetch_script.py makes to resolve
        # DFC filenames (raises the 60 req/hr unauthenticated cap to 5000).
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 tools/forge_fetch/provision_decks.py

    - name: Save card scripts cache
      # Save right after provisioning (before the build can fail) so the first
      # green-or-red run leaves a warm cache. No-op on an exact-key hit.
      if: always() && steps.cards-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          bin/resources/cardsfolder
          bin/resources/tokenscripts
        key: cards-v2-${{ hashFiles('tools/forge_fetch/FORGE_PIN') }}-${{ hashFiles('bin/resources/decks/**/*.dk', 'src/card_vocab.h', 'tools/forge_fetch/*.py') }}

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}-${{ hashFiles('src/**', 'tools/**', 'Makefile') }}
        restore-keys: ccache-${{ runner.os }}-

    - name: Install ccache
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache

    - name: Build engine (headless, debug)
      shell: bash
      # Default debug build on purpose: keeps warnings, _GLIBCXX_ASSERTIONS and
      # the engine's WARNING:/assert paths active (better bug detection than
      # RELEASE, whose -march=native is wrong for shared runners).
      run: make -j"$(nproc)" CXX="ccache g++" CC="ccache gcc"
