name: Nightly fuzz

on:
  schedule:
    # 08:00 UTC daily.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      games:
        description: Games per matchup
        default: "40"
      seed:
        description: Base RNG seed (blank => derived from run number)
        default: ""

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: explore
            label: explore
          - mode: "explore:patient"
            label: explore-patient
    steps:
      - uses: actions/checkout@v4

      - name: Set up robomage
        uses: ./.github/actions/setup-robomage

      # Rotate the seed each night (from the run number) so new game lines are
      # explored over time; always print it so a finding is reproducible locally.
      - name: Deep fuzz sweep (all league matchups)
        run: |
          SEED="${{ inputs.seed }}"
          if [ -z "$SEED" ]; then SEED=$(( ${{ github.run_number }} * 100000 )); fi
          GAMES="${{ inputs.games }}"; GAMES="${GAMES:-40}"
          echo "seed=$SEED mode=${{ matrix.mode }} games=$GAMES"
          {
            echo "### Nightly fuzz — mode \`${{ matrix.mode }}\`"
            echo "Reproduce locally:"
            echo '```'
            echo "train/.venv/bin/python train/ci_check.py --tier fuzz --matchups all \\"
            echo "  --mode ${{ matrix.mode }} --fuzz-games $GAMES --seed $SEED"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          train/.venv/bin/python train/ci_check.py \
            --tier fuzz --matchups all --mode "${{ matrix.mode }}" \
            --fuzz-games "$GAMES" --seed "$SEED" --out-dir ci_out

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Seed is recoverable from the run number (see the step summary).
          name: nightly-fuzz-${{ matrix.label }}-${{ github.run_number }}
          path: ci_out/
          retention-days: 14

  # AlphaZero actor parity gate (ci_check --tier actor): obs bit-parity, MCTS
  # visit-count parity, and shard schema for bin/az_actor, in BOTH bo1 and bo3.
  # Kept OUT of the per-push ci.yml because it needs the ~GB libtorch runtime
  # (torch) that the default CI image deliberately omits; runs nightly instead.
  actor-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up robomage
        uses: ./.github/actions/setup-robomage

      # torch supplies both the Python AZ stack (run_search / AZNet, needed by the
      # parity references) and the libtorch the actor links. CPU-only wheel keeps
      # the download small; cached across nights. stable_baselines3/sb3-contrib
      # are also required here: extractor.py (imported by az_net.py, which the
      # actor-parity tests import) unconditionally imports
      # stable_baselines3.common.torch_layers and
      # sb3_contrib.common.maskable.policies at module load. The default CI
      # image (setup-robomage) deliberately omits both, since ordinary CI never
      # touches the AZ actor stack — installed here only, not there.
      - name: Cache torch wheel
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-torch-cpu-${{ runner.os }}

      - name: Install torch (CPU) + stable-baselines3 + build the actor
        run: |
          train/.venv/bin/python -m pip install --quiet torch \
            --index-url https://download.pytorch.org/whl/cpu
          train/.venv/bin/python -m pip install --quiet stable-baselines3 sb3-contrib
          make actor -j"$(nproc)"

      - name: AZ actor parity (bo1 + bo3)
        run: train/.venv/bin/python train/ci_check.py --tier actor --out-dir ci_out

      - name: Upload actor-parity output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-actor-parity-${{ github.run_number }}
          path: ci_out/
          retention-days: 14
