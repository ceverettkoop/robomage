name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up robomage
        uses: ./.github/actions/setup-robomage

      # Fixed default seed => a red PR is the diff's fault, not RNG. Runs every
      # tier: codegen-sync, vocab coverage, byte-identical replay corpus,
      # deterministic league smoke, short fuzz. This image has no torch/SB3/
      # textual/matplotlib, so the browser tier and the clispec legs that need them skip;
      # nightly-fuzz.yml's full-check job runs them.
      - name: Run engine test gate
        run: train/.venv/bin/python train/ci_check.py --out-dir ci_out

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-transcripts-${{ github.run_id }}
          path: ci_out/
          retention-days: 14
