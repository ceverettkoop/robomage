name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up robomage
        uses: ./.github/actions/setup-robomage

      # Fixed default seed => a red PR is the diff's fault, not RNG. `make check`
      # runs every tier of the C++ gate bin/debug/robomage_check (vocab, concede,
      # scenarios, byte-identical replay corpus, state and knowledge self-checks,
      # explore fuzz, bench, and the smoke tier through the stdlib-only Python
      # driver); transcripts land in ci_out/.
      - name: Run engine test gate
        run: make check -j"$(nproc)" CXX="ccache g++" CC="ccache gcc"

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-transcripts-${{ github.run_id }}
          path: ci_out/
          retention-days: 14
